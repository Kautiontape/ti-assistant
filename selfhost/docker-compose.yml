# Self-hosted stack. Run it through ./compose (this folder) so the Firebase
# service account is read from the vault at startup. See selfhost/README.md.
services:
  app:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?see .env.example}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?see .env.example}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?see .env.example}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:?see .env.example}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:?see .env.example}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?see .env.example}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?see .env.example}
    image: ti-assistant:selfhost
    restart: unless-stopped
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_sa
    secrets:
      - firebase_sa
    ports:
      # Loopback by default; put your reverse proxy in front.
      - "${TI_BIND:-127.0.0.1}:${TI_PORT:-3000}:3000"

  # Stands in for App Engine's cron.yaml. The route only checks that the
  # X-Appengine-Cron header is present, so the reverse proxy must block
  # /api/process-games and /api/update-games from outside.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          curl -fsS -H "X-Appengine-Cron: true" http://app:3000/api/process-games \
            || echo "process-games failed"
        done

secrets:
  firebase_sa:
    environment: FIREBASE_SERVICE_ACCOUNT_JSON
