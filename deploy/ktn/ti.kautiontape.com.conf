# nginx site for ti.kautiontape.com on ktn. This file is the source of truth: edit it
# here, then copy it to /etc/nginx/sites-available/ti.kautiontape.com (symlinked into
# sites-enabled) and run `sudo nginx -t && sudo systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name ti.kautiontape.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ti.kautiontape.com;
    include snippets/ssl-kautiontape.conf;

    # Cron-only routes. The compose `cron` service calls them on the Docker network.
    location ~ ^/api/(process|update)-games {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8119;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # App Engine strips this header from outside requests; so must we.
        proxy_set_header X-Appengine-Cron "";
    }
}
