# Merges ti-assistant/ti-assistant main into this fork. See FORK.md.
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests".
name: Upstream sync

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: upstream-sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream https://github.com/ti-assistant/ti-assistant.git
          git fetch upstream main
          echo "behind=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.fetch.outputs.behind != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="$(git merge-base HEAD upstream/main)"
          # Files both sides changed since the last merge: the seams to re-check.
          comm -12 \
            <(git diff --name-only "$base" HEAD | sort) \
            <(git diff --name-only "$base" upstream/main | sort) > overlap.txt
          git log --oneline --no-merges HEAD..upstream/main > commits.txt
          git switch -c "$SYNC_BRANCH"
          if git merge --no-edit -m "upstream: Merge ti-assistant/main" upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.conflict == 'false'
        with:
          node-version: 24
          cache: npm

      - name: Build
        if: steps.merge.outputs.conflict == 'false'
        id: build
        continue-on-error: true
        run: npm ci --ignore-scripts && npm run build

      - name: Open or update PR
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push --force origin "$SYNC_BRANCH"
          {
            echo "Merges $(wc -l < commits.txt) upstream commit(s)."
            echo
            echo "**Build:** ${{ steps.build.outcome }}"
            echo
            echo "**Files both sides changed** (re-check these seams against FORK.md):"
            if [ -s overlap.txt ]; then sed 's/^/- `/; s/$/`/' overlap.txt; else echo "none"; fi
            echo
            echo "<details><summary>Upstream commits</summary>"
            echo
            sed 's/^/- /' commits.txt
            echo
            echo "</details>"
          } > body.md
          if gh pr view "$SYNC_BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$SYNC_BRANCH" --body-file body.md
          else
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "upstream: Merge ti-assistant/main" --body-file body.md
          fi

      - name: Report conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          {
            echo "Merging upstream/main into main conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo "Resolve by hand (see FORK.md, Merging upstream)."
          } > body.md
          title="upstream: Merge conflict with ti-assistant/main"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
