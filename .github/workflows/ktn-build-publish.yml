# Builds the ktn image on GitHub (ktn itself must never build images) and
# publishes it from the ktn branch. sync/** pushes and PRs are build-only gates.
name: ktn build & publish

on:
  push:
    branches: [ktn, "sync/**"]
    paths-ignore:
      - "**.md"
      - "docs/ktn/**"
  pull_request:
    branches: [ktn]
  workflow_dispatch:

concurrency:
  group: ktn-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/ktn'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kautiontape/ti-assistant
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/ktn' }}
            type=sha
      # NEXT_PUBLIC_* are repo variables, not secrets: they ship to every browser.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ktn/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/ktn' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
