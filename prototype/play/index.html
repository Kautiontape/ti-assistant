<title>Twilight Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Michroma&display=swap">
<style>
/* Phone-first table companion: one column of phase-specific cards over a bottom tab bar;
   two columns (Now beside Table) from 760px. Dark first: game nights are dim.
   Teal (hue ~195) is the only accent; no player colour uses that hue. */
:root {
  color-scheme: dark;
  --bg: oklch(0.17 0.022 252);
  --panel: oklch(0.215 0.026 252);
  --raise: oklch(0.265 0.03 252);
  --line: oklch(0.335 0.03 252);
  --ink: oklch(0.955 0.008 252);
  --muted: oklch(0.74 0.02 252);
  --faint: oklch(0.6 0.02 252);
  --accent: oklch(0.8 0.115 195);
  --accent-ink: oklch(0.2 0.04 215);
  --accent-soft: oklch(0.31 0.055 200);
  --scrim: oklch(0.08 0.01 252 / 0.62);
  --shadow: 0 18px 44px -20px oklch(0 0 0 / 0.85);
  --p-red: oklch(0.68 0.19 29);
  --p-orange: oklch(0.76 0.15 62);
  --p-yellow: oklch(0.86 0.15 95);
  --p-green: oklch(0.73 0.18 145);
  --p-blue: oklch(0.69 0.15 262);
  --p-purple: oklch(0.69 0.17 300);
  --p-magenta: oklch(0.71 0.21 350);
  --p-black: oklch(0.11 0.005 252);
  --p-black-ring: oklch(0.93 0.01 252);
  --display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --top-h: 56px;
  --tabs-h: 62px;
  --gutter: 16px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: oklch(0.965 0.006 252); --panel: oklch(0.995 0.003 252); --raise: oklch(0.93 0.01 252); --line: oklch(0.86 0.012 252);
    --ink: oklch(0.22 0.025 252); --muted: oklch(0.45 0.025 252); --faint: oklch(0.58 0.02 252);
    --accent: oklch(0.52 0.1 205); --accent-ink: oklch(0.99 0.01 200); --accent-soft: oklch(0.9 0.04 200);
    --scrim: oklch(0.2 0.02 252 / 0.4); --shadow: 0 18px 44px -24px oklch(0.2 0.03 252 / 0.45);
    --p-red: oklch(0.55 0.19 29); --p-orange: oklch(0.62 0.15 62); --p-yellow: oklch(0.72 0.15 95); --p-green: oklch(0.56 0.17 145);
    --p-blue: oklch(0.52 0.16 262); --p-purple: oklch(0.52 0.18 300); --p-magenta: oklch(0.56 0.21 350);
    --p-black: oklch(0.2 0.01 252); --p-black-ring: oklch(0.2 0.01 252);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: oklch(0.965 0.006 252); --panel: oklch(0.995 0.003 252); --raise: oklch(0.93 0.01 252); --line: oklch(0.86 0.012 252);
  --ink: oklch(0.22 0.025 252); --muted: oklch(0.45 0.025 252); --faint: oklch(0.58 0.02 252);
  --accent: oklch(0.52 0.1 205); --accent-ink: oklch(0.99 0.01 200); --accent-soft: oklch(0.9 0.04 200);
  --scrim: oklch(0.2 0.02 252 / 0.4); --shadow: 0 18px 44px -24px oklch(0.2 0.03 252 / 0.45);
  --p-red: oklch(0.55 0.19 29); --p-orange: oklch(0.62 0.15 62); --p-yellow: oklch(0.72 0.15 95); --p-green: oklch(0.56 0.17 145);
  --p-blue: oklch(0.52 0.16 262); --p-purple: oklch(0.52 0.18 300); --p-magenta: oklch(0.56 0.21 350);
  --p-black: oklch(0.2 0.01 252); --p-black-ring: oklch(0.2 0.01 252);
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, .clock { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell */
.app { min-height: 100%; display: flex; flex-direction: column; }
.proto { display: flex; align-items: center; gap: 8px; padding: 6px var(--gutter); padding-top: calc(6px + env(safe-area-inset-top, 0px)); font-size: .78rem; color: var(--muted); border-bottom: 1px dashed var(--line); }
.proto b { font-family: var(--display); font-weight: 400; letter-spacing: .12em; font-size: .62rem; color: var(--faint); }
.proto .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proto button { min-height: 44px; padding: 0 12px; border: 1px dashed var(--line); background: none; border-radius: 999px; cursor: pointer; color: var(--muted); }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; min-height: var(--top-h); padding: 6px var(--gutter); background: var(--bg); border-bottom: 1px solid var(--line); }
.phase { display: grid; line-height: 1.1; }
.phase .p { font-family: var(--display); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; }
.phase .r { font-size: .74rem; color: var(--muted); }
.top .turn { flex: 1; min-width: 0; display: flex; justify-content: center; }
.seatbtn { min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.seatbtn .you { font-size: .68rem; color: var(--muted); }
main { flex: 1; padding: 12px var(--gutter) calc(var(--tabs-h) + 88px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.cols { display: grid; gap: 14px; align-content: start; }
@media (min-width: 760px) {
  main.split { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; max-width: 1180px; margin: 0 auto; width: 100%; }
  main:not(.split) { max-width: 720px; margin: 0 auto; width: 100%; }
}
.tabs { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { min-height: var(--tabs-h); border: 0; background: none; cursor: pointer; display: grid; place-items: center; gap: 2px; padding: 8px 0 6px; color: var(--muted); font-size: .78rem; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }

/* Player chips: colour, icon and name always together */
.chip { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; vertical-align: middle; }
.chip .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .pl { color: var(--muted); font-weight: 400; white-space: nowrap; }
/* The emblem sits on a neutral disc; the player's colour is the ring around it. */
.sw { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: oklch(0.14 0.01 252); box-shadow: inset 0 0 0 3px var(--c, var(--line)); }
.sw img { width: 19px; height: 19px; object-fit: contain; }
.sw.sm { width: 22px; height: 22px; box-shadow: inset 0 0 0 2.5px var(--c, var(--line)); } .sw.sm img { width: 13px; height: 13px; }
.sw.lg { width: 42px; height: 42px; box-shadow: inset 0 0 0 4px var(--c, var(--line)); } .sw.lg img { width: 26px; height: 26px; }
.sw[data-c="Black"] { box-shadow: inset 0 0 0 3px var(--p-black), 0 0 0 1.5px var(--p-black-ring); }

/* Cards and sections */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.hero { border-color: color-mix(in oklch, var(--c, var(--accent)) 55%, var(--line)); box-shadow: inset 4px 0 0 var(--c, var(--accent)); }
.eyebrow { font-family: var(--display); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.eyebrow .num { letter-spacing: 0; font-size: .8rem; }
h2.title { margin: 0; font-size: 1.12rem; line-height: 1.25; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; margin: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 0; border-top: 1px solid var(--line); min-width: 0; }
.list li:first-child { border-top: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.on { border-color: var(--accent); color: var(--accent); }
.pill.now { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Buttons: 44px minimum everywhere */
.btn { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; }
.btn.block { width: 100%; }
.btn.tall { min-height: 64px; font-size: 1.05rem; }
.btn.small { min-height: 44px; padding: 0 12px; font-weight: 700; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .hint { display: block; font-weight: 400; font-size: .78rem; color: inherit; opacity: .8; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .btn { flex-direction: column; gap: 0; min-height: 72px; }
.help { border-style: dashed; color: var(--accent); background: none; }
.linkbtn { background: none; border: 0; padding: 0 4px; min-height: 44px; color: var(--accent); cursor: pointer; font-weight: 700; }

/* Race */
.race li { gap: 10px; }
.race .vp { font-family: var(--mono); font-weight: 600; font-size: 1.15rem; width: 2.2ch; text-align: right; }
.bar { position: relative; height: 8px; border-radius: 99px; background: var(--raise); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--c, var(--accent)); border-radius: 99px; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px; font-size: .74rem; color: var(--muted); }

/* Strategy board */
.sc { display: grid; grid-template-columns: 1.8ch minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 44px; border-top: 1px solid var(--line); padding: 4px 0; cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.sc:first-child { border-top: 0; }
.sc .n { font-family: var(--mono); color: var(--muted); }
.sc.used .nm2 { color: var(--faint); }

/* Feed */
.feed { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.feed li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.feed li:first-child { border-top: 0; }
.feed .t { font-size: .74rem; color: var(--faint); font-family: var(--mono); }
.feed .by { display: block; font-size: .76rem; color: var(--accent); }
.feed .hd { grid-column: 1 / -1; font-family: var(--display); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: 6px; }

/* Sheets and toast */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--panel); border-radius: 18px 18px 0 0; border: 1px solid var(--line); padding: 8px var(--gutter) calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); display: grid; gap: 12px; }
.sheet .grab { justify-self: center; width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px 0; }
.sheet header { display: flex; align-items: center; gap: 10px; }
.sheet header h2 { flex: 1; margin: 0; font-size: 1.08rem; }
.close { min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: none; cursor: pointer; }
.text { white-space: pre-line; margin: 0; }
.search { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 14px; font: inherit; }
.pick { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.pick button { min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 10px; text-align: left; }
.pick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.pick button:disabled { opacity: .45; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 52px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; padding: 6px 2px; }
.opt:first-child { border-top: 0; }
.opt .meta { margin-left: auto; color: var(--muted); font-size: .82rem; white-space: nowrap; }
.sentence { font-size: 1.2rem; line-height: 1.35; margin: 4px 0; text-wrap: balance; }
.toast { position: fixed; z-index: 15; left: var(--gutter); right: var(--gutter); bottom: calc(var(--tabs-h) + 12px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 6px 6px 6px 14px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.toast span { flex: 1; min-width: 0; }
.toast button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: color-mix(in oklch, var(--bg) 18%, var(--ink)); color: var(--bg); font-weight: 700; cursor: pointer; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent); }
.banner .grow { flex: 1; min-width: 0; }
.replay { position: fixed; z-index: 7; left: 0; right: 0; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); background: var(--raise); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px; padding: 6px var(--gutter); }
.replay .grow { flex: 1; min-width: 0; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.replay button { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.stepper { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 8px; align-items: center; }
.stepper button { min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); font-size: 1.4rem; cursor: pointer; }
.stepper output { text-align: center; font-family: var(--mono); font-size: 2rem; font-weight: 600; }
.ticks { display: flex; gap: 6px; flex-wrap: wrap; }
.map svg { width: 100%; height: auto; display: block; }
.map .tile { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; cursor: pointer; }
.map .tile.home { fill: var(--raise); }
.map .tile:focus-visible { outline: none; stroke: var(--accent); stroke-width: 3; }
.map text { fill: var(--muted); font-family: var(--mono); font-size: 9px; }
.techs { display: grid; gap: 6px; }
.techs .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.RED { background: var(--p-red); } .dot.BLUE { background: var(--p-blue); } .dot.GREEN { background: var(--p-green); } .dot.YELLOW { background: var(--p-yellow); } .dot.UPGRADE { background: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(24px); opacity: .6; } } }
</style>
<div id="app"><p style="padding:24px">Loading the game…</p></div>
<script type="module" src="app.js"></script>
